{
  "name": "Sync THREAT-BASE datasets",
  "on": {
    "schedule": [
      {
        "cron": "0 0 * * *",
        "timezone": "Asia/Kolkata"
      }
    ],
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "threat-base-data-publication",
    "cancel-in-progress": false
  },
  "jobs": {
    "sync": {
      "if": "(github.event_name == 'workflow_dispatch' || vars.SYNC_ENABLED == 'true') && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 180,
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": true
          }
        },
        {
          "name": "Mirror original source data",
          "run": "bash .github/scripts/sync.sh"
        },
        {
          "name": "Publish source directories",
          "env": {
            "TARGET_BRANCH": "${{ github.event.repository.default_branch }}"
          },
          "run": "set -Eeuo pipefail\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add -- cvelistV5 nvd-json-data-feeds github-advisory-database pypa-advisory-database mitre-attack cisa-advisories cisa-kev epss cwe capec redhat-advisories .upstream-state\ngit diff --cached --quiet && exit 0\ngit commit -m \"data: synchronize upstream datasets\"\nfor attempt in 1 2 3; do\n  git push origin \"HEAD:$TARGET_BRANCH\" && exit 0\n  git fetch origin \"$TARGET_BRANCH\"\n  if ! git rebase \"origin/$TARGET_BRANCH\"; then\n    git rebase --abort\n    exit 1\n  fi\ndone\nexit 1"
        }
      ]
    }
  }
}
