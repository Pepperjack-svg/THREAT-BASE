{
  "name": "Monthly THREAT-BASE release",
  "on": {
    "schedule": [
      {
        "cron": "0 1 1 * *",
        "timezone": "Asia/Kolkata"
      }
    ],
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "threat-base-data-publication",
    "cancel-in-progress": false
  },
  "jobs": {
    "release": {
      "if": "github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 180,
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Package and verify dataset snapshot",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "bash .github/scripts/release.sh"
        }
      ]
    }
  }
}
